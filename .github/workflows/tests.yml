name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-tests:
    name: Browser-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Galerie-Tests
        run: node tests/gallery.test.mjs

      - name: Messwert-Feld-Tests
        run: node tests/fields.test.mjs

      - name: UI-Tests (Version, Sync-Datum, Galerie-Beschriftung)
        run: node tests/ui.test.mjs

      - name: Build-Log-Galerie
        run: node tests/buildlog-gallery.test.mjs

      - name: Kapitelstatus und Befunde
        run: node tests/findings.test.mjs

      - name: Bildnamen und Doubletten
        run: node tests/photo-identity.test.mjs

      - name: Kraftstoffsystem
        run: node tests/fuel-system.test.mjs

      - name: Vergaser: Zerlegen, Synchronisieren, Bedueusung
        run: node tests/carb-tuning.test.mjs

  # Prueft die tatsaechlich ausgelieferte Seite. Laeuft nur auf main und
  # blockiert nichts, weil ein Aussetzer bei GitHub Pages oder der GitHub-API
  # nichts ueber den Code aussagt.
  smoke-live:
    name: Smoke-Test gegen die Live-Seite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: browser-tests

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Live-Seite pruefen
        run: node tests/smoke-live.mjs
