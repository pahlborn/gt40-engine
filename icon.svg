<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2b6cb0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Piston body -->
  <rect x="156" y="180" width="200" height="200" rx="16" fill="#e2e8f0" stroke="#a0aec0" stroke-width="6"/>
  <!-- Ring grooves -->
  <rect x="146" y="200" width="220" height="8" rx="3" fill="#a0aec0"/>
  <rect x="146" y="220" width="220" height="8" rx="3" fill="#a0aec0"/>
  <rect x="146" y="244" width="220" height="6" rx="3" fill="#a0aec0"/>
  <!-- Piston pin -->
  <rect x="186" y="310" width="140" height="24" rx="12" fill="#718096"/>
  <!-- Connecting rod -->
  <rect x="236" y="340" width="40" height="100" rx="8" fill="#a0aec0" stroke="#718096" stroke-width="3"/>
  <!-- Valve reliefs (dish) -->
  <ellipse cx="210" cy="188" rx="22" ry="8" fill="#cbd5e0" stroke="#a0aec0" stroke-width="2"/>
  <ellipse cx="302" cy="188" rx="22" ry="8" fill="#cbd5e0" stroke="#a0aec0" stroke-width="2"/>
  <!-- Text: 302 -->
  <text x="256" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="72" fill="#ed8936">302</text>
  <!-- Text: BOSS -->
  <text x="256" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="36" fill="rgba(255,255,255,0.9)">BOSS</text>
  <!-- Wrench accent -->
  <text x="256" y="480" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="600" font-size="28" fill="rgba(255,255,255,0.6)">BUILD LOG</text>
</svg>
